version: "v0.4"

project:
  name: "Vectored Logic: Four-State Directional Collision Algebra"
  description: "A Lean formalization of the core four-state rules of Vectored Logic: Pro-Active True, Retro-Active True, Emergent Paradox, and Static Absolute, together with vector inversion, collision, paradox containment, and absolute absorption."
  authors:
    - "Nishant Gautam"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Nishant Gautam"

classification:
  arxiv: ["math.LO"]
  msc2020: ["03B50", "03B52"]

sources:
  - title: "Twisted Horizon Mathematics: A Complete Conceptual Guide to Vectored Logic & Dynamic State Mechanics"
    relationship: "independently-proves"
    note: "The Lean development formalizes the four-state rules supplied by the author in the accompanying informal manuscript."

status:
  scope: "The formalization covers the four intentional truth states, vector inversion, the complete 4-by-4 collision table, closure, inversion involution, commutativity and idempotence of collision, directional-opposition collision, paradox containment under collision, and Static Absolute absorption."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "manual"
  framework: "Lean 4 with Mathlib; Palomar Comparator format"
  tool_setup: "Formalization prepared from the author's supplied Vectored Logic rules; proofs use case analysis and exact definitional reduction."

fidelity:
  divergences: "The informal phrase that truth carries momentum is represented by the four operational states and their transition rules; no additional quantitative momentum variable is introduced."

review:
  status: "self-assessed"
  reviewers: []
  notes: "The statement surface was checked against the author's supplied four-state definitions and collision/inversion rules. The proof development contains no custom axioms or sorry-based proof declarations in the Solution."

alignment:
  namespace: "VectoredLogic"
  statements:
    - source: "Four Fundamental States and Vector Inversion"
      lean: "VectoredLogic.State"
      module: "VectoredLogic"
      status: "proved"
      note: "Defines the four states and their inversion exactly as supplied."
    - source: "Collision Operator and Paradox/Absorption Laws"
      lean: "VectoredLogic.collide"
      module: "VectoredLogic"
      status: "proved"
      note: "Defines the complete 4-by-4 collision table and proves its stated core properties."

acknowledgements: "Lean, Mathlib, and the Palomar Registry submission format."
